import com.android.build.api.artifact.SingleArtifact
import com.fongmi.gradle.AbiApkPackaging

plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) {
    localPropsFile.withInputStream {
        localProps.load(it)
    }
}

// 版本号自 docs/ChangeLog.md 派生的规则见 R-261030-0002：
// 条目格式：## 2026-10-29 (v1.0.0)
//   versionCode = yyyyMMdd * 10 + 当日序号（同日多发版本也能单调递增，供应用内更新比较）
//   versionName = 条目内的语义化版本，与发布版本一致（缺省回落 0.0.0）
// 当日序号 = ChangeLog 顶部连续同一日期的条目数（最新条目排最前，故最上方条目序号最大）
def changelog = {
    def entries = []
    rootProject.file('docs/ChangeLog.md').readLines('UTF-8').each { line ->
        def dm = line =~ /^##\s+\[?(\d{4})-(\d{2})-(\d{2})/
        if (dm.find()) {
            def vm = line =~ /\(v?(\d+\.\d+\.\d+)\)/
            entries << [date: dm.group(1) + dm.group(2) + dm.group(3), name: vm.find() ? vm.group(1) : '0.0.0']
        }
    }
    if (entries.isEmpty()) return [code: 0, name: '0.0.0']
    def head = entries[0]
    def seq = entries.takeWhile { it.date == head.date }.size()
    [code: head.date.toInteger() * 10 + seq, name: head.name]
}()

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode changelog.code.toInteger()
        versionName changelog.name
        buildConfigField "String", "UPDATE_REPO", "\"${providers.gradleProperty('tvUpdateRepo').getOrElse('')}\""
        manifestPlaceholders.runtimeCatalog = providers.gradleProperty('tvRuntimeCatalog').getOrElse('')
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["device"]

    productFlavors {
        leanback {
            dimension "device"
        }
        mobile {
            dimension "device"
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk = false
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // 签名来源：本地 local.properties，CI 环境变量（见 .github/workflows/release.yml）；都缺省时出未签名包
    def signingStore = localProps['storeFile'] ?: System.getenv('KEYSTORE_FILE')
    def signingAlias = localProps['keyAlias'] ?: System.getenv('KEY_ALIAS')
    def signingPass = localProps['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')

    signingConfigs {
        if (signingStore) {
            release {
                storeFile file(signingStore)
                keyAlias signingAlias
                keyPassword signingPass
                storePassword signingPass
            }
        }
    }

    buildTypes {
        debug {
            // 不复用 release 签名：避免调试包可覆盖正式包（SEC-20）
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            if (signingStore) signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

AbiApkPackaging.configure(project, SingleArtifact.APK.INSTANCE)

