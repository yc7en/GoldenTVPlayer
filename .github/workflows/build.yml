name: Build APK

# 构建产物：
#   mobile-arm64_v8a / mobile-armeabi_v7a / leanback-arm64_v8a / leanback-armeabi_v7a
# 触发：
#   1. push 到 main            → 编译并把 APK 上传为 workflow artifact（不入 Release）
#   2. push 标签 v*            → 编译 + 创建 GitHub Release 并附上 APK
#   3. Pull Request            → 仅编译校验
#   4. 手动 workflow_dispatch  → 同 push to main
#
# 签名（可选）：仓库 Secrets 里配置以下三项即产出可安装的正式签名包；
#   缺省时产出未签名 APK（文件名带 -unsigned，安装会失败，仅供校验用）。
#     KEYSTORE_BASE64    release.jks 的 base64（`base64 -w0 release.jks`）
#     KEY_ALIAS          keystore 里的 key alias
#     KEYSTORE_PASSWORD  keystore 与 key 的密码（本项目两者相同）

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Provision Android SDK
        run: |
          set -uo pipefail
          # 不依赖 android-actions/setup-android（其自身在 runner 上曾失败），
          # 直接用 ubuntu-latest 镜像预装的 SDK；找不到 sdkmanager 时交给 AGP 自动下载。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT"     >> "$GITHUB_ENV"

          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            for p in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$p" ]; then SDKM="$p"; break; fi
            done
          fi
          if [ -z "$SDKM" ]; then
            echo "::warning::未找到 sdkmanager，跳过预装，交由 AGP 构建时自动下载"
            exit 0
          fi
          echo "使用 sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # 注意：SDK Platform 37 的包名是 platforms;android-37.0（ApiLevel 37.0），
          # 不是 android-37，故两个名字都试，任一成功即可。
          for pkg in "platform-tools" "platforms;android-37.0" "platforms;android-37" "build-tools;37.0.0"; do
            if "$SDKM" --install "$pkg" > /dev/null 2>&1; then
              echo "已安装 $pkg"
            else
              echo "::warning::$pkg 预装失败（AGP 构建时会尝试自动下载）"
            fi
          done

      - name: Resolve version from ChangeLog
        id: ver
        run: |
          set -uo pipefail
          VER=$(grep -m1 -oE '\(v?[0-9]+\.[0-9]+\.[0-9]+\)' docs/ChangeLog.md | tr -d '()v')
          CODE=$(grep -m1 -oE '^##[[:space:]]+\[?[0-9]{4}-[0-9]{2}-[0-9]{2}' docs/ChangeLog.md \
                 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tr -d '-')
          VER=${VER:-0.0.0}
          CODE=${CODE:-0}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"    >> "$GITHUB_OUTPUT"
          echo "ChangeLog 解析结果：versionName=$VER  versionCode=$CODE"

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -uo pipefail
          KB="${KEYSTORE_BASE64:-}"
          KA="${KEY_ALIAS:-}"
          KP="${KEYSTORE_PASSWORD:-}"
          # 只报告长度，绝不打印内容；用于快速定位「哪个 Secret 是空的 / 名字写错了」
          mark() { if [ "$1" -gt 0 ]; then echo '已注入'; else echo '**缺失**'; fi; }
          {
            echo "### 签名配置检查"
            echo ""
            echo "| Secret | 字符数 | 状态 |"
            echo "|---|---:|---|"
            echo "| KEYSTORE_BASE64 | ${#KB} | $(mark ${#KB}) |"
            echo "| KEY_ALIAS | ${#KA} | $(mark ${#KA}) |"
            echo "| KEYSTORE_PASSWORD | ${#KP} | $(mark ${#KP}) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$KB" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::签名未生效：KEYSTORE_BASE64=${#KB} KEY_ALIAS=${#KA} KEYSTORE_PASSWORD=${#KP}（字符数，0 表示该 Secret 读不到）"
            exit 0
          fi

          if ! echo "$KB" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::error::KEYSTORE_BASE64 解码失败，请确认粘贴的是完整的 base64（不要带换行或 BOM）"
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$KA"
            echo "storePassword=$KP"
          } > local.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "已注入发布签名配置（keystore $(stat -c%s "$RUNNER_TEMP/release.jks") 字节）"

      - name: Build release APKs
        run: ./gradlew assembleMobileRelease assembleLeanbackRelease --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          set -uo pipefail
          VER="${{ steps.ver.outputs.version }}"
          SUFFIX=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then SUFFIX="-unsigned"; fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          count=0
          # 只取 release 产物，避免命中历史 debug 包
          while IFS= read -r apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "dist/GoldenTVPlayer-v${VER}-${base}${SUFFIX}.apk"
            count=$((count + 1))
          done < <(find app/build/outputs/apk -type f -path "*/release/*.apk" | sort)
          echo "共收集 $count 个 APK"
          ls -lh dist/
          if [ "$count" -eq 0 ]; then
            echo "::error::没有产出任何 APK，请检查上面的构建日志"
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTVPlayer-v${{ steps.ver.outputs.version }}${{ steps.collect.outputs.suffix }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
