name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 未配置，将产出未签名 APK"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/signing.jks"
            cat > "$GITHUB_WORKSPACE/local.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/signing.jks
          keyAlias=$KEY_ALIAS
          storePassword=$KEYSTORE_PASSWORD
          EOF
          fi

      - name: Build release APKs
        run: ./gradlew assembleMobileRelease assembleLeanbackRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
